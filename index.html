<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>accompanyME — Find. Book. Perform.</title>
<meta name="description" content="A new home for accompanists, and the simplest way to find one. Launching in NSW mid-2026.">
<meta property="og:title" content="accompanyME — Find. Book. Perform.">
<meta property="og:description" content="A new home for accompanists, and the simplest way to find one. Launching in NSW mid-2026.">
<meta property="og:image" content="brand/assets/logo-full.png">
<link rel="icon" href="brand/assets/logo-monogram.png">
<link rel="stylesheet" href="landing.css">
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: var(--am-off-white); }
  #root { width: 100%; }
  /* Hide content during first paint to avoid wrong-device flash */
  #root[data-ready="false"] { visibility: hidden; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root" data-ready="false"></div>

<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="variants.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

// Responsive: switch the `device` prop based on viewport width.
function useDevice(breakpoint = 720) {
  const get = () => (typeof window !== 'undefined' && window.innerWidth < breakpoint) ? 'mobile' : 'desktop';
  const [device, setDevice] = useState(get);
  useEffect(() => {
    const onResize = () => setDevice(get());
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  return device;
}

function App() {
  const device = useDevice();
  useEffect(() => {
    document.getElementById('root').setAttribute('data-ready', 'true');
  }, []);
  return <V2Split device={device} />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
